name: test
on: push
jobs:
  start_test:
    runs-on: ubuntu-latest
    steps:
      - name: Chekout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: install deps
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          

      - name: run tests
        run: |
          #starting ...
          docker compose up
          
          #start test_01
          curl http://127.0.0.1:8080 > res.txt
          
          #reults : 
          cat res.txt
