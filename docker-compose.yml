services:
  app:
    build: .

    container_name: fast_api_app
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db

    depends_on:
      - db
    networks:
      - app_network
  db:
    image: postgres:17
    container_name: container_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network
networks:
  app_network:
    driver: bridge

volumes:
  pg_data: